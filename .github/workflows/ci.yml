name: CI

# Roda a cada push e pull request em main e develop. Instala exatamente as
# versões do package-lock.json (npm ci) — as mesmas que `npm run setup`
# instala na máquina de quem usa o projeto — e prova, numa máquina limpa,
# que o projeto instala, passa na verificação e compila o JavaScript que o
# Expo Go (iOS e Android) e o navegador carregam.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  verificar:
    name: Instalar, verificar e compilar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (versoes travadas)
        run: npm ci --no-audit --no-fund

      - name: Conferir versoes com o SDK do Expo
        run: npx expo install --check

      - name: Plugin de worklets roda uma vez so
        run: node scripts/ci/testar-babel.cjs

      - name: expo-doctor
        run: npx expo-doctor

      - name: Diagnostico do projeto
        run: node scripts/doctor.mjs

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes de dominio
        run: npm test

      - name: Compilar para iOS
        run: npx expo export --platform ios --output-dir dist-ios

      - name: Compilar para Android
        run: npx expo export --platform android --output-dir dist-android

      - name: Compilar para web
        run: npx expo export --platform web --output-dir dist-web

      # Compilar nao e rodar: abre a web num navegador de verdade, percorre
      # as telas com e sem dados, nos 4 temas, e falha em qualquer erro de
      # JavaScript.
      - name: Preparar navegador para o teste da web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Abrir a web e percorrer as telas
        run: node scripts/ci/testar-web.mjs dist-web

      # O que roda na maquina de quem usa o projeto e o servidor de
      # desenvolvimento (npm start / npm run web), que mostra na tela erros que
      # a compilacao final esconde. Ele e testado do mesmo jeito.
      - name: Subir o servidor de desenvolvimento
        run: |
          (CI=1 npx expo start --web --port 8081 > /tmp/expo.log 2>&1 &)
          for i in $(seq 1 90); do curl -sf http://localhost:8081 >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8081 >/dev/null || (cat /tmp/expo.log; exit 1)

      - name: Percorrer as telas no servidor de desenvolvimento
        env:
          BASE_URL: http://localhost:8081
        run: node scripts/ci/testar-web.mjs

      - name: Terminal do Expo sem erro
        run: |
          sed 's/\x1b\[[0-9;]*m//g' /tmp/expo.log | tail -60
          if grep -q " ERROR " /tmp/expo.log; then echo "O terminal do Expo mostrou ERROR"; exit 1; fi

      - name: Guardar as fotos das telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telas
          path: telas/
          if-no-files-found: ignore
          retention-days: 30
