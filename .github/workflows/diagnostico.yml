name: Diagnostico completo

# Rascunho de desenvolvimento: gera as fotos das telas e as imprime no log,
# porque o ambiente onde o codigo e mantido nao consegue baixar artefatos.

on:
  workflow_dispatch:
  push:
    branches: ['ci/**']

jobs:
  telas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx expo export --platform web --output-dir dist-web
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: node scripts/ci/testar-web.mjs dist-web
      - name: Fotos no log
        if: always()
        run: |
          cat > /tmp/reduzir.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
          for (const f of fs.readdirSync('telas').filter((x) => x.endsWith('.png')).sort()) {
            const dados = fs.readFileSync(path.join('telas', f)).toString('base64');
            await p.setContent(`<body style="margin:0"><img style="width:390px;display:block" src="data:image/png;base64,${dados}"></body>`);
            await p.waitForTimeout(100);
            const jpg = await p.screenshot({ type: 'jpeg', quality: 78, fullPage: true });
            console.log(`===FOTO-INICIO ${f.replace('.png', '')}===`);
            const s = jpg.toString('base64');
            for (let i = 0; i < s.length; i += 120) console.log(s.slice(i, i + 120));
            console.log('===FOTO-FIM===');
          }
          await b.close();
          JS
          cp /tmp/reduzir.mjs ./reduzir.mjs && node reduzir.mjs
