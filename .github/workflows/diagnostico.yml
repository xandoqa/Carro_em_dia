name: Diagnostico completo

# Rascunho de desenvolvimento: gera as fotos das telas e as imprime no log,
# porque o ambiente onde o codigo e mantido nao consegue baixar artefatos.

on:
  workflow_dispatch:
  push:
    branches: ['ci/**']

jobs:
  telas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx expo export --platform web --output-dir dist-web
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: node scripts/ci/testar-web.mjs dist-web
      - name: Fotos no log
        if: always()
        run: |
          for f in telas/*.png; do
            n=$(basename "$f" .png)
            convert "$f" -resize 50% -quality 72 "/tmp/$n.jpg"
            echo "===FOTO-INICIO $n==="
            base64 -w 120 "/tmp/$n.jpg"
            echo "===FOTO-FIM==="
          done
